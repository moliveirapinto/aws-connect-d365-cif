AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS bridge for streaming Amazon Connect Contact Lens real-time transcript into
  a D365 Omnichannel conversation (via the ingestor) and to the CIF agent widget.
  (Raw CloudFormation - no SAM/Serverless transform, to avoid CreateChangeSet
  restriction on arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-09)

Parameters:
  IngestorUrl:
    Type: String
    Description: HTTPS URL of the D365 ingestor Function `transcript` endpoint.
  IngestorKey:
    Type: String
    NoEcho: true
    Description: Function-level key (x-functions-key) for the ingestor.
  PollIntervalMs:
    Type: Number
    Default: 1500
    Description: Contact Lens poll cadence in milliseconds.

Resources:
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byContact
          KeySchema:
            - AttributeName: contactId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ActiveTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: contactId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---- WebSocket API for the CIF agent widget ----
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aws-connect-d365-transcript-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbCrud
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub "${ConnectionsTable.Arn}/index/*"

  WebSocketFn:
    Type: AWS::Lambda::Function
    Properties:
      Handler: websocket.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 900
      Role: !GetAtt WebSocketFnRole.Arn
      Code: .aws-sam/build/WebSocketFn/
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WS_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFn.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      Target: !Sub "integrations/${WebSocketIntegration}"
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      Target: !Sub "integrations/${WebSocketIntegration}"
  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "subscribe"
      Target: !Sub "integrations/${WebSocketIntegration}"
  UnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "unsubscribe"
      Target: !Sub "integrations/${WebSocketIntegration}"
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      Target: !Sub "integrations/${WebSocketIntegration}"

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - SubscribeRoute
      - UnsubscribeRoute
      - DefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: prod
      AutoDeploy: true

  WebSocketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ---- Poller: reads Contact Lens real-time segments and fans them out ----
  PollerFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TableAndConnectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt ActiveTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt ConnectionsTable.Arn
                  - !Sub "${ConnectionsTable.Arn}/index/*"
              - Effect: Allow
                Action: ["connect:ListRealtimeContactAnalysisSegments"]
                Resource: "*"
              - Effect: Allow
                Action: ["execute-api:ManageConnections"]
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
              - Effect: Allow
                Action: ["lambda:InvokeFunction"]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-poller"

  PollerFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-poller"
      Handler: poller.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 900
      Role: !GetAtt PollerFnRole.Arn
      Code: .aws-sam/build/PollerFn/
      Environment:
        Variables:
          INGESTOR_URL: !Ref IngestorUrl
          INGESTOR_KEY: !Ref IngestorKey
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          ACTIVE_TABLE: !Ref ActiveTable
          WS_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
          POLL_INTERVAL_MS: !Ref PollIntervalMs
          POLLER_FUNCTION_NAME: !Sub "${AWS::StackName}-poller"

  # ---- Lifecycle: called by the Connect contact flow at call start/end ----
  LifecycleFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ActiveTableAndInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt ActiveTable.Arn
              - Effect: Allow
                Action: ["lambda:InvokeFunction"]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-poller"

  LifecycleFn:
    Type: AWS::Lambda::Function
    Properties:
      Handler: lifecycle.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LifecycleFnRole.Arn
      Code: .aws-sam/build/LifecycleFn/
      Environment:
        Variables:
          INGESTOR_URL: !Ref IngestorUrl
          INGESTOR_KEY: !Ref IngestorKey
          ACTIVE_TABLE: !Ref ActiveTable
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WS_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
          POLLER_FUNCTION_NAME: !Sub "${AWS::StackName}-poller"

  LifecycleConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LifecycleFn
      Principal: connect.amazonaws.com

Outputs:
  WebSocketUrl:
    Description: WebSocket URL for the CIF widget (VITE_TRANSCRIPT_WS_URL).
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  LifecycleFunctionArn:
    Description: Add this ARN to the Connect contact flow "Invoke AWS Lambda function" block.
    Value: !GetAtt LifecycleFn.Arn
